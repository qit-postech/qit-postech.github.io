name: Build, verify, and deploy Pages

# Publish authorized changes on main; external pull requests do not deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  SITE_URL: ${{ vars.SITE_URL || 'https://qit-postech.github.io' }}
  BASE_PATH: ${{ vars.BASE_PATH || '/' }}
  CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
  PUBLICATION_MODE: ${{ vars.PUBLICATION_MODE || 'public' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install locked dependencies
        run: npm ci
      - name: Build static site
        run: npm run build
      - name: Verify generated routes and local links
        run: node scripts/verify-build.mjs
      - name: Upload verified site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
